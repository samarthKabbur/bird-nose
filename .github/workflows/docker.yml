# Builds the dev image to prove containers/Dockerfile still works. The image
# is never pushed anywhere. Runs when container files change, on main, and
# weekly, because the apt packages it installs change upstream even when this
# repository does not. See docs/ci.md.
name: Docker image

on:
  pull_request:
    paths:
      - containers/**
      - .github/workflows/docker.yml
  push:
    branches: [main]
    paths:
      - containers/**
      - .github/workflows/docker.yml
  schedule:
    - cron: "17 9 * * 1"  # Mondays 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the dev image (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        # The image (Gazebo, Nav2, Clearpath) needs more room than a hosted
        # runner has free by default; these preinstalled SDKs are unused here.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: containers/Dockerfile
          target: dev
          push: false
          # Layers are cached between runs. Only main writes the cache, so
          # pull requests reuse main's layers without evicting them.
          cache-from: type=gha,scope=dev-image
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,scope=dev-image,mode=max' || '' }}
